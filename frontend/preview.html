<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renderer Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      }
      #wrap {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #controls {
        flex: 0 0 auto;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 8px 12px;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 13px;
      }
      #controls button,
      #controls select {
        background: #334155;
        color: #e2e8f0;
        border: 1px solid #475569;
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 13px;
        cursor: pointer;
      }
      #controls label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      #stage {
        flex: 1 1 auto;
        position: relative;
        overflow: hidden;
        background: #f8fafc;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="controls">
        <label>
          Fixture
          <select id="fixture">
            <option value="demo">demo</option>
            <option value="sample">sample</option>
          </select>
        </label>
        <label><input type="checkbox" id="notes" /> Notes</label>
        <button id="scramble">Scramble positions</button>
        <button id="reset">Reset positions</button>
        <button id="fit">Fit</button>
        <span id="status"></span>
      </div>
      <div id="stage"></div>
    </div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
