[package]
name = "dbml-diagrams"
version = "0.1.0"
description = "Local DBML ER-diagram tool"
authors = ["upliv"]
edition = "2021"
rust-version = "1.77.2"
default-run = "dbml-diagrams"

[lib]
name = "dbml_diagrams_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parser_rs = { path = "../parser-rs" }
base64 = "0.22"
