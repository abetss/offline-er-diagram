[package]
name = "parser_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "parser_rs"
path = "src/lib.rs"

[[bin]]
name = "parse"
path = "src/bin/parse.rs"

[[bin]]
name = "mermaid"
path = "src/bin/mermaid.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
